name: Check Unit 5 Submission

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  check-submission:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const UNIT = 5;
            const EXPECTED_BRANCH = 'unit-5-work';
            const PLACEHOLDER = '_Your answer here._';
            const ASSIGNMENTS = [
              { title: "Assignment 1: Introduction to Docker", files: ["assignment-1/unit6-postgis-volume.png"] },
              { title: "Assignment 2: PostGIS Docker Setup", files: ["assignment-2/data_dir.png","assignment-2/screenshot_connection.png","assignment-2/screenshot_table.png"] },
              { title: "Assignment 3: Introduction to PostGIS", files: [] }
            ];

            const pr = context.payload.pull_request;
            const { owner, repo } = context.repo;
            const notes = [];
            if (pr.head.ref !== EXPECTED_BRANCH) {
              notes.push(`⚠️ This Pull Request comes from branch \`${pr.head.ref}\`. Unit ${UNIT} work should be on \`${EXPECTED_BRANCH}\`.`);
            }

            const tree = await github.rest.git.getTree({ owner, repo, tree_sha: pr.head.sha, recursive: 'true' });
            const present = new Set(tree.data.tree.filter(t => t.type === 'blob').map(t => t.path));

            let text = null;
            if (present.has('SUBMISSION.md')) {
              const resp = await github.rest.repos.getContent({ owner, repo, path: 'SUBMISSION.md', ref: pr.head.sha });
              text = Buffer.from(resp.data.content, 'base64').toString('utf8');
            } else {
              notes.push('❌ `SUBMISSION.md` is missing from the repository root.');
            }
            const parts = text ? text.split(/^## /m) : [];

            let rows = '';
            let allDone = text !== null;
            for (const a of ASSIGNMENTS) {
              const problems = [];
              const body = parts.find(p => p.startsWith(a.title));
              if (text !== null && !body) problems.push('section heading not found in `SUBMISSION.md`');
              if (body) {
                const left = body.split(PLACEHOLDER).length - 1;
                if (left > 0) problems.push(`${left} unanswered placeholder${left === 1 ? '' : 's'}`);
              }
              const missing = a.files.filter(f => !present.has(f));
              if (missing.length) problems.push('missing ' + missing.map(f => '`' + f + '`').join(', '));
              if (problems.length) allDone = false;
              rows += `| ${problems.length ? '❌' : '✅'} | ${a.title} | ${problems.join('; ') || 'complete'} |\n`;
            }

            const comments = await github.rest.issues.listComments({ owner, repo, issue_number: pr.number });
            for (const c of comments.data) {
              if (c.user.login === 'github-actions[bot]' && c.body.includes(`Unit ${UNIT} Submission Check`)) {
                await github.rest.issues.deleteComment({ owner, repo, comment_id: c.id });
              }
            }

            const status = allDone
              ? '✅ All assignments are complete. Submit this Pull Request URL to D2L.'
              : '❌ Some items are incomplete. Assignments you have not reached yet show ❌ until you finish them.';
            const body = [
              `## Unit ${UNIT} Submission Check`, '',
              ...notes, ...(notes.length ? [''] : []),
              status, '',
              '| Status | Assignment | Details |',
              '|--------|------------|---------|',
              rows,
              '_Push another commit to re-run this check._'
            ].join('\n');
            await github.rest.issues.createComment({ owner, repo, issue_number: pr.number, body });
